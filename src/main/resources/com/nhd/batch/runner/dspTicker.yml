---
jobName: "DSP_TICKER"
httpRequests:
  - pageName: "homePage"
    url: "https://www.nseindia.com"
  - pageName: "tickerPage"
    url: "https://www.nseindia.com/get-quotes/equity?symbol=##ticker##"
  - pageName: "tickerDetails"
    url: "https://www.nseindia.com/api/quote-equity?symbol=##ticker##"
    retrieveOutput: true
    outputKey: companyDetails
  - pageName: "tickerTradeDetails"
    url: "https://www.nseindia.com/api/quote-equity?symbol=##ticker##&section=trade_info"
    retrieveOutput: true
    outputKey: tradeDetails


