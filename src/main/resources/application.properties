# spring.profiles.active=postgresdb
spring.profiles.active=local
#spring.profiles.active=supa

spring.application.name=nhd-loader

server.servlet.context-path=/loader
spring.database.driverClassName=org.postgresql.Driver

spring.data.web.page-serialization-mode=via-dto

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=lt
spring.liquibase.liquibase-schema=liquibase
