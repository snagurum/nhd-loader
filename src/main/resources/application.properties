# spring.profiles.active=postgresdb
spring.profiles.active=local
#spring.profiles.active=supa

spring.application.name=nhd-loader

# Maximum number of stocks processed by one scheduled BSP history-load run.
loader.bsp_ticker.stocks_per_run=100

# NSE crawler limits. A timeout set in a bot/page YAML file takes precedence over
# loader.crawler.default-request-timeout-seconds.
loader.crawler.connect-timeout-seconds=10
loader.crawler.default-request-timeout-seconds=10
loader.crawler.request-delay-millis=1000
loader.crawler.dsp-request-delay-millis=1000
loader.crawler.dsp-progress-log-interval=100

# Default size for pageable loader API responses.
spring.data.web.pageable.default-page-size=1000

server.servlet.context-path=/loader
spring.database.driverClassName=org.postgresql.Driver

spring.data.web.page-serialization-mode=via-dto

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=lt
spring.liquibase.liquibase-schema=lt


logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{20} : %msg%n


